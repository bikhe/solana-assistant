[project]
name = "solana-core"
version = "0.1.0"
description = "Solana voice assistant core: audio, wake word, STT, TTS, LLM, tools, MCP and skills"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "comtypes>=1.4 ; sys_platform == 'win32'",
    "httpx>=0.28",
    "keyring>=25.6",
    "mss>=10.0",
    "numpy>=2.1",
    "onnxruntime>=1.20",
    "platformdirs>=4.3",
    "psutil>=7.0",
    "pycaw>=20240210 ; sys_platform == 'win32'",
    "pydantic>=2.11",
    "send2trash>=1.8",
    "sounddevice>=0.5",
    "tomli-w>=1.2",
    "websockets>=15.0",
    "winrt-windows-media-control>=3.0 ; sys_platform == 'win32'",
]

# Local speech engines are optional: the core runs (cloud or fake) without them.
# `uv sync --extra speech` installs the default local stack.
[project.optional-dependencies]
faster-whisper = ["faster-whisper>=1.1"]
gigaam = ["onnx-asr[cpu]>=0.12"]
silero = ["torch>=2.5"]
# piper-tts is GPL-3.0 (it links espeak-ng); it is never bundled, only installed on request.
piper = ["piper-tts>=1.3"]
speech = ["solana-core[faster-whisper,gigaam,silero,piper]"]

[project.scripts]
solana-core = "solana_core.__main__:main"

[dependency-groups]
dev = [
    "datamodel-code-generator==0.34.0",
    "mypy>=1.17",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "ruff>=0.12",
    "types-psutil>=7.2.2.20260906",
    "types-send2trash>=2.1.0.20260408",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["solana_core"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["solana_core/protocol/generated.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
# Russian text in strings and comments is expected, not a homoglyph mistake.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["solana_core", "tests", "scripts"]

[[tool.mypy.overrides]]
module = [
    "keyring.*",
    "onnxruntime.*",
    "sounddevice.*",
    "faster_whisper.*",
    "onnx_asr.*",
    "piper.*",
    "torch.*",
    "comtypes.*",
    "pycaw.*",
    "winrt.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
