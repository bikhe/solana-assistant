[project]
name = "solana-core"
version = "0.1.0"
description = "Solana voice assistant core: audio, wake word, STT, TTS, LLM, tools, MCP and skills"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "comtypes>=1.4 ; sys_platform == 'win32'",
    "keyring>=25.6",
    "mss>=10.0",
    "platformdirs>=4.3",
    "psutil>=7.0",
    "pycaw>=20240210 ; sys_platform == 'win32'",
    "pydantic>=2.11",
    "send2trash>=1.8",
    "tomli-w>=1.2",
    "websockets>=15.0",
    "winrt-windows-media-control>=3.0 ; sys_platform == 'win32'",
]

[project.scripts]
solana-core = "solana_core.__main__:main"

[dependency-groups]
dev = [
    "datamodel-code-generator==0.34.0",
    "mypy>=1.17",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "ruff>=0.12",
    "types-psutil>=7.2.2.20260906",
    "types-send2trash>=2.1.0.20260408",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["solana_core"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["solana_core/protocol/generated.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
# User-facing text is Russian; short words like "Не" are all "confusable" letters.
ignore = ["RUF001"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["solana_core", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["keyring.*", "comtypes.*", "pycaw.*", "winrt.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
