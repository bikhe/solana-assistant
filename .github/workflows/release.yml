name: Release

# A tag such as v0.2.0 builds the installers on all three OSes and attaches them to a draft
# GitHub release. Publishing the draft makes it the update that installed apps download.
# Pull requests that touch packaging build the same installers as workflow artifacts.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - core/packaging/**
      - core/pyproject.toml
      - core/uv.lock
      - app/src-tauri/**
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  draft:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.result }}
    steps:
      - id: release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace("refs/tags/", "");
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Solana ${tag.slice(1)}`,
              body: "Установщики ниже. Как установить: docs/RELEASING.md#установка",
              draft: true,
              prerelease: tag.includes("-"),
            });
            return data.id;

  build:
    name: build (${{ matrix.os }})
    needs: draft
    # Run on pull requests and manual runs too, where the draft job is skipped.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04: an older glibc keeps the AppImage and deb working on older distros.
        # macos-latest is Apple Silicon; Intel Macs are not built (no PyInstaller cross-build).
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: core/uv.lock
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Build the core sidecar
        working-directory: core
        run: |
          uv sync --locked
          uv run python packaging/build_sidecar.py --smoke
      - name: Write the release config
        working-directory: core
        shell: bash
        run: uv run python packaging/release_config.py ${{ github.ref_type == 'tag' && format('--tag {0}', github.ref_name) || '' }}
      - run: pnpm install --frozen-lockfile
        working-directory: app

      - name: Build installers and upload them to the draft release
        if: needs.draft.result == 'success'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          releaseId: ${{ needs.draft.outputs.id }}
          args: --config ../core/packaging/build/tauri.ci.conf.json
      - name: Build installers
        if: needs.draft.result != 'success'
        working-directory: app
        run: pnpm tauri build --config ../core/packaging/build/tauri.ci.conf.json
      - name: Upload installers
        if: needs.draft.result != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: solana-${{ runner.os }}
          if-no-files-found: error
          path: |
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/rpm/*.rpm
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/dmg/*.dmg
