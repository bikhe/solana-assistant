name: Build installers

# Called by release.yml. Builds the sidecar and the installers on all three OSes. With a
# release id it uploads them to that draft release, otherwise to workflow artifacts.
# Signing secrets and write access come only from the caller's tag job.

on:
  workflow_call:
    inputs:
      release-id:
        description: Draft release to upload to; empty uploads workflow artifacts
        type: string
        default: ""
      tag:
        description: Release tag, checked against the app version
        type: string
        default: ""
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04: an older glibc keeps the AppImage and deb working on older distros.
        # macos-latest is Apple Silicon; Intel Macs are not built (no PyInstaller cross-build).
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: core/uv.lock
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Build the core sidecar
        working-directory: core
        run: |
          uv sync --locked
          uv run python packaging/build_sidecar.py --smoke
      - name: Write the release config
        working-directory: core
        shell: bash
        run: uv run python packaging/release_config.py ${RELEASE_TAG:+--tag "$RELEASE_TAG"}
      - run: pnpm install --frozen-lockfile
        working-directory: app

      - name: Build installers and upload them to the draft release
        if: inputs.release-id != ''
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: app
          releaseId: ${{ inputs.release-id }}
          args: --config ../core/packaging/build/tauri.ci.conf.json
      - name: Build installers
        if: inputs.release-id == ''
        working-directory: app
        run: pnpm tauri build --config ../core/packaging/build/tauri.ci.conf.json
      - name: Upload installers
        if: inputs.release-id == ''
        uses: actions/upload-artifact@v4
        with:
          name: solana-${{ runner.os }}
          if-no-files-found: error
          path: |
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/rpm/*.rpm
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/dmg/*.dmg
