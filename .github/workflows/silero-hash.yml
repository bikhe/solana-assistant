# Temporary: computes the SHA-256 of the Silero weights to pin in the model catalog.
name: silero hash

on:
  pull_request:
    paths: [".github/workflows/silero-hash.yml"]

jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsSL -o v4_ru.pt https://models.silero.ai/models/tts/ru/v4_ru.pt
          ls -l v4_ru.pt
          sha256sum v4_ru.pt
