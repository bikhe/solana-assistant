[package]
name = "solana-app"
version = "0.1.0"
description = "Solana voice assistant"
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "solana_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
